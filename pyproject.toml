[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
  ".omx",
  "data",
  "media",
  "output",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM"]
ignore = [
  "E501",
  "B008",     # FastAPI Depends in argument defaults
  "ASYNC230", # Allow blocking open() for simple file storage
  "ASYNC240", # Allow blocking pathlib methods
  "ASYNC109", # Allow timeout parameter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = "venv"
include = ["app", "tests"]
exclude = [
  "venv",
  ".venv",
  ".omx",
  "data",
  "media",
  "output",
]
