version: "3.9"

services:
  # ============================================
  # FastAPI Application
  # ============================================
  app:
    build: .
    container_name: gmc-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://crawler:crawler_pass@postgres:5432/global_media_crawler
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gmc-network

  # ============================================
  # Celery Worker
  # ============================================
  worker:
    build: .
    container_name: gmc-worker
    command: celery -A app.core.task_queue:celery_app worker --loglevel=info --concurrency=4 -Q crawl,media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://crawler:crawler_pass@postgres:5432/global_media_crawler
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gmc-network

  # ============================================
  # Celery Beat (Scheduler)
  # ============================================
  beat:
    build: .
    container_name: gmc-beat
    command: celery -A app.core.task_queue:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gmc-network

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: gmc-postgres
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler_pass
      POSTGRES_DB: global_media_crawler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d global_media_crawler"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gmc-network

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: gmc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gmc-network

  # ============================================
  # Flower - Celery Monitoring (Optional)
  # ============================================
  flower:
    build: .
    container_name: gmc-flower
    command: celery -A app.core.task_queue:celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gmc-network

volumes:
  postgres_data:
  redis_data:

networks:
  gmc-network:
    driver: bridge
